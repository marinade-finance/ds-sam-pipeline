name: Evaluate Auction

on:
  workflow_dispatch:
    inputs:
      epoch:
        description: 'Current epoch'
        required: true
        type: number
      slot:
        description: 'Current slot in epoch'
        required: true
        type: number

jobs:
  auction:
    name: Run the auction
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{secrets.PAT_TOKEN}}
      - name: Checkout DS SAM
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: marinade-finance/ds-sam
          path: ds-sam
      - name: Checkout SAM blacklist
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: marinade-finance/sam-blacklist
          path: sam-blacklist
          # sam-blacklist is private (the calc stays private); read it with a
          # dedicated read-only deploy key scoped to that repo.
          ssh-key: ${{ secrets.SAM_BLACKLIST_KEY }}
      - name: Setup NodeJS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 9
      - name: Run the auction
        env:
          # solana-sandwich-report API (owns all epoch CSVs); sam-blacklist reads it.
          SANDWICH_API_BASE: ${{ vars.SANDWICH_API_BASE }}
        run: |
          run_id="${{ inputs.epoch }}.${{ inputs.slot }}"
          echo "run_id=$run_id" >> $GITHUB_ENV
          mkdir auctions/$run_id

          inputs_dir="$PWD/auctions/$run_id/inputs"
          outputs_dir="$PWD/auctions/$run_id/outputs"
          echo "inputs_dir=$inputs_dir" >> $GITHUB_ENV
          echo "outputs_dir=$outputs_dir" >> $GITHUB_ENV
          mkdir "$inputs_dir"
          mkdir "$outputs_dir"
          cp auction-config.json "$inputs_dir/config.json"

          # Seed the current blacklist (repo root), then let the private
          # sam-blacklist add fresh entries in place (report API + trillium).
          # The auction then reads it via --blacklist-file so results reflect it.
          cp blacklist.csv "$inputs_dir/blacklist.csv"
          pushd sam-blacklist
          pnpm i --frozen-lockfile
          pnpm main "$inputs_dir/blacklist.csv"
          popd

          pushd ds-sam
          pnpm i --frozen-lockfile
          pushd packages/ds-sam-sdk
          pnpm build
          popd
          echo "Running auction: $run_id"
          pnpm run cli -- auction -c "$inputs_dir/config.json" --inputs-source APIS --cache-inputs --cache-dir-path "$inputs_dir" --blacklist-file "$inputs_dir/blacklist.csv" -o "$outputs_dir" > /dev/null
          popd
      - name: Create a PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          run_id="${{ env.run_id }}"
          branch_name="auction/$run_id"
          outputs_dir="${{ env.outputs_dir }}"

          git config --global user.name 'Autonomous Auction Pipeline'
          git config --global user.email 'bot@noreply.marinade.finance'
          git checkout -b "$branch_name"
          # Republish the run's blacklist at the repo root so raw-URL consumers
          # have a stable path (git symlinks aren't followed by raw.githubusercontent).
          cp "${{ env.inputs_dir }}/blacklist.csv" blacklist.csv
          git add auctions blacklist.csv
          git status

          echo "Creating a PR..."
          git commit -m "auction run $run_id"
          git push -u origin "$branch_name"
          pr_url=$(gh pr create -B main -t "Publish Auction Results ($run_id)" -F "$outputs_dir/summary.md")
          echo "PR created: $pr_url"
          echo "pr_url=$pr_url" >> $GITHUB_ENV
      - name: Notify success
        if: success()
        env:
          DISCORD_AUCTION_WEBHOOK_URL: ${{ secrets.DISCORD_AUCTION_WEBHOOK_URL }}
        run: |
          run_id="${{ env.run_id }}"
          pr_url="${{ env.pr_url }}"

          echo "Sending Discord success notification..."
          curl "$DISCORD_AUCTION_WEBHOOK_URL" -H "Content-Type: application/json" -d '{
            "embeds": [
              {
                "title": "Auction PR ('"$run_id"') prepared",
                "url": "'"$pr_url"'",
                "color": "5661687"
              }
            ]
          }'
          echo "Discord success notification sent"
      - name: Notify failure
        if: failure()
        env:
          DISCORD_AUCTION_WEBHOOK_URL: ${{ secrets.DISCORD_AUCTION_WEBHOOK_URL }}
        run: |
          echo "Sending Discord failure notification..."
          curl "$DISCORD_AUCTION_WEBHOOK_URL" -H "Content-Type: application/json" -d '{
            "embeds": [
              {
                "title": "Auction PR preparation failed!",
                "color": "15539236"
              }
            ]
          }'
          echo "Discord failure notification sent"
